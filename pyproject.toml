[project]
name = "tgl-tamp"
version = "0.1.0"
description = "Trajectory-guided learning for task and motion planning (MEAM 5170)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pillow",
    "pydantic>=2",
    "imageio",
    "casadi",
]

[project.optional-dependencies]
train = [
    "torch",
    "transformers",
    "peft",
    "trl",
    "datasets",
    "accelerate",
]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["env*", "opt*", "planner*", "data*", "eval*"]
